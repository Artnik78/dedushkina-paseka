<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Сервис временно не работает · Цифровой мёд</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f6f1e5,#e8efdf);color:#203b2b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,520px);padding:42px 28px;text-align:center;background:#fffdf7;border:1px solid #e3dcc9;border-radius:22px;box-shadow:0 18px 55px #253b2517}
.bee{font-size:42px;margin-bottom:14px}
h1{font-size:clamp(23px,5vw,30px);line-height:1.2;margin:0 0 12px;font-weight:750}
p{margin:0;color:#687466;font-size:18px;letter-spacing:.02em}
.rule{width:54px;height:3px;margin:24px auto 0;border-radius:5px;background:#c49a3a}
</style>
</head>
<body>
<main>
<div class="bee" aria-hidden="true">🐝</div>
<h1>Сервис временно не работает</h1>
<p>Цифровой мёд</p>
<div class="rule"></div>
</main>
</body>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка установки — Дедушкина пасека</title>
<meta name="theme-color" content="#d8a32b">
<link rel="manifest" href="manifest-pwa.webmanifest">
<style>
body{font-family:system-ui,sans-serif;background:#fffaf0;color:#25352b;margin:0;padding:20px}
main{max-width:700px;margin:auto}
h1{font-size:24px}.card{background:white;border:1px solid #e5e0d5;border-radius:14px;padding:16px;margin:12px 0}
.ok{color:#18733a}.bad{color:#b23a2b}.wait{color:#8a6814}
button,a{display:inline-block;padding:11px 14px;border-radius:10px;border:0;background:#1d6337;color:white;text-decoration:none;margin:5px 5px 0 0}
small{color:#708078}
</style>
</head>
<body>
<main>
<h1>🐝 Проверка установки</h1>
<div class="card" id="result">Проверяем...</div>
<div class="card" id="installCard" style="display:none;background:#fff8df;border-color:#d8a32b">
<b>🎉 Chrome разрешил установку!</b><br>
<button id="installBtn" style="margin-top:12px;background:#d8a32b;color:#2f220f;font-weight:700">📲 Установить «Дедушкина пасека»</button>
<div id="installStatus" style="margin-top:8px;color:#708078"></div>
</div>
<div class="card"><b>Если здесь все пункты зелёные</b><br>пришлите мне скриншот этой страницы — по нему определим, что именно блокирует установку.</div>
<a href="./">← Вернуться в журнал</a>
<button onclick="location.reload()">Повторить проверку</button>
</main>
<script>
const out=document.getElementById('result');
let deferredInstallPrompt=null;
const rows=[];
function row(name,ok,detail=''){rows.push('<div style="padding:7px 0;border-bottom:1px solid #eee"><b class="'+(ok?'ok':'bad')+'">'+(ok?'✓':'✗')+' '+name+'</b>'+(detail?' — '+detail:'')+'</div>');}
async function check(){
 row('HTTPS / защищённое соединение',location.protocol==='https:',location.protocol);
 const link=document.querySelector('link[rel="manifest"]');
 row('Ссылка на manifest',!!link,link?link.href:'не найдена');
 let manifest=null;
 try{
   const r=await fetch(link.href,{cache:'no-store'});
   row('Manifest доступен',r.ok,r.status+' '+r.headers.get('content-type'));
   if(r.ok){manifest=await r.json();row('Manifest корректный JSON',true);}
 }catch(e){row('Manifest доступен',false,e.message);}
 if(manifest){
   row('name',!!manifest.name,manifest.name||'нет');
   row('start_url',!!manifest.start_url,manifest.start_url||'нет');
   row('scope',!!manifest.scope,manifest.scope||'нет');
   row('display=standalone',manifest.display==='standalone',manifest.display||'нет');
   row('2 иконки',Array.isArray(manifest.icons)&&manifest.icons.length>=2,'найдено: '+(manifest.icons?.length||0));
   for(const icon of (manifest.icons||[])){
     try{
       const r=await fetch(new URL(icon.src,link.href),{cache:'no-store'});
       row('Иконка '+icon.sizes,r.ok,r.status);
     }catch(e){row('Иконка '+icon.sizes,false,e.message);}
   }
 }
 if('serviceWorker' in navigator){
   try{
     const reg=await navigator.serviceWorker.getRegistration('/dedushkina-paseka/journal/');
     row('Service Worker зарегистрирован',!!reg,reg?reg.scope:'не найден');
     row('Service Worker активен',!!(reg&&reg.active),reg&&reg.active?reg.active.scriptURL:'не активен');
   }catch(e){row('Service Worker',false,e.message);}
 }else row('Service Worker поддерживается',false,'браузер не поддерживает');
 row('Установка уже выполнена',window.matchMedia('(display-mode: standalone)').matches,'нет — это нормально');
 out.innerHTML=rows.join('');
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  row('Chrome разрешил установку',true,'событие beforeinstallprompt получено');
  document.getElementById('installCard').style.display='block';
});
document.getElementById('installBtn').onclick=async()=>{
  if(!deferredInstallPrompt){
    document.getElementById('installStatus').textContent='Chrome пока не передал окно установки. Обновите страницу и повторите проверку.';
    return;
  }
  deferredInstallPrompt.prompt();
  const choice=await deferredInstallPrompt.userChoice;
  document.getElementById('installStatus').textContent=choice.outcome==='accepted'?'Установка запущена.':'Установка отменена.';
  deferredInstallPrompt=null;
};
window.addEventListener('appinstalled',()=>{
  document.getElementById('installStatus').textContent='Приложение установлено.';
});
check();
</script>
</body>
</html>
